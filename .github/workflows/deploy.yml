name: Deploy

# Publishes Togetherly to Cloudflare. Everything is resolved at deploy time —
# the database is created if missing and its id written into wrangler.jsonc —
# so publishing needs no local terminal and no files edited by hand.

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check credentials are present
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Create the database if it does not exist
        run: node scripts/provision.mjs

      # Migrations are additive and wrangler records which have already run,
      # so this is safe on every push.
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply togetherly --remote

      - name: Deploy
        run: npx wrangler deploy
